name: Build Myafgram Native Android

on:
  workflow_dispatch:
  push:
    branches: [native-android]
    paths:
      - '.github/workflows/build-native-android.yml'
      - 'README-NATIVE-ANDROID.md'

permissions:
  contents: read

jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Myafgram configuration
        uses: actions/checkout@v4
        with:
          ref: native-android

      - name: Validate Telegram API configuration
        env:
          API_ID: ${{ vars.MYAFGRAM_API_ID }}
          API_HASH: ${{ secrets.MYAFGRAM_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Add MYAFGRAM_API_ID and MYAFGRAM_API_HASH as repository Variables before building."
            exit 1
          fi
          if ! [[ "$API_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::MYAFGRAM_API_ID must contain digits only."
            exit 1
          fi

      - name: Checkout official Telegram Android source
        run: |
          git clone --recursive --depth=1 --shallow-submodules https://github.com/DrKLO/Telegram.git telegram-native
          cd telegram-native
          git rev-parse HEAD | tee ../telegram-source-commit.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Configure Myafgram application
        env:
          API_ID: ${{ vars.MYAFGRAM_API_ID }}
          API_HASH: ${{ secrets.MYAFGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path("telegram-native")
          build_vars = root / "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          s = build_vars.read_text()
          s = re.sub(r'public static int APP_ID = [0-9]+;', f'public static int APP_ID = {os.environ["API_ID"]};', s)
          s = re.sub(r'public static String APP_HASH = "[^"]*";', f'public static String APP_HASH = "{os.environ["API_HASH"]}";', s)
          s = s.replace('public static boolean CHECK_UPDATES = true;', 'public static boolean CHECK_UPDATES = false;')
          s = s.replace('public static boolean SUPPORTS_PASSKEYS = true;', 'public static boolean SUPPORTS_PASSKEYS = false;')
          s = s.replace('public static boolean IS_BILLING_UNAVAILABLE = false;', 'public static boolean IS_BILLING_UNAVAILABLE = true;')
          s = re.sub(r'public static String SAFETYNET_KEY = "[^"]*";', 'public static String SAFETYNET_KEY = "";', s)
          s = re.sub(r'public static String GOOGLE_AUTH_CLIENT_ID = "[^"]*";', 'public static String GOOGLE_AUTH_CLIENT_ID = "";', s)
          s = re.sub(r'public static String HUAWEI_APP_ID = "[^"]*";', 'public static String HUAWEI_APP_ID = "";', s)
          build_vars.write_text(s)
          props = root / "gradle.properties"
          p = props.read_text()
          p = re.sub(r'^APP_PACKAGE=.*$', 'APP_PACKAGE=com.myafgram.android', p, flags=re.M)
          p = re.sub(r'^org.gradle.jvmargs=.*$', 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g', p, flags=re.M)
          props.write_text(p)
          strings = root / "TMessagesProj/src/main/res/values/strings.xml"
          st = strings.read_text()
          st = re.sub(r'(<string name="AppName">).*?(</string>)', r'\1Мяфграм\2', st, count=1)
          st = re.sub(r'(<string name="AppNameBeta">).*?(</string>)', r'\1Мяфграм\2', st, count=1)
          strings.write_text(st)
          # Supply a package-matched placeholder Firebase config so the source can compile.
          # Push notifications require the project's own Firebase configuration before release.
          firebase = {
            "project_info": {"project_number":"000000000000","project_id":"myafgram-placeholder","storage_bucket":"myafgram-placeholder.appspot.com"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id":"1:000000000000:android:0000000000000000",
                "android_client_info":{"package_name":"com.myafgram.android.beta"}
              },
              "api_key":[{"current_key":"AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],
              "services":{}
            }],
            "configuration_version":"1"
          }
          (root / "TMessagesProj_App/google-services.json").write_text(json.dumps(firebase, indent=2))
          PY

      - name: Build native Android APK
        working-directory: telegram-native
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Collect APK and build metadata
        run: |
          mkdir -p dist
          find telegram-native/TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -exec cp {} dist/myafgram-native-debug.apk \;
          test -s dist/myafgram-native-debug.apk
          cp telegram-source-commit.txt dist/
          printf 'Source: https://github.com/DrKLO/Telegram\n' > dist/SOURCE.txt
          printf 'Unofficial Myafgram build. Push notifications require a project-owned Firebase configuration.\n' >> dist/SOURCE.txt

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: myafgram-native-android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
