name: Build Myafgram Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm exec vite build
        env:
          VITE_API_ID: ${{ vars.MYAFGRAM_API_ID }}
          VITE_API_HASH: ${{ vars.MYAFGRAM_API_HASH }}
      - name: Install Capacitor tooling
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.devDependencies={...p.devDependencies,'@capacitor/core':'^7.0.0','@capacitor/cli':'^7.0.0','@capacitor/android':'^7.0.0','@capacitor/assets':'^3.0.0'}; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
          pnpm install --no-frozen-lockfile
      - name: Add Android platform
        run: npx cap add android
      - name: Install image conversion tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Generate Android app icons from the supplied artwork
        run: |
          mkdir -p resources
          convert public/assets/img/myafgram-icon.jpg -resize 1024x1024^ -gravity center -extent 1024x1024 resources/icon.png
          npx capacitor-assets generate --android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Sync web app into Android project
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myafgram-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
