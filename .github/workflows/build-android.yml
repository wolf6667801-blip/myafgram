name: Build Myafgram Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm exec vite build
        env:
          VITE_API_ID: ${{ vars.MYAFGRAM_API_ID }}
          VITE_API_HASH: ${{ vars.MYAFGRAM_API_HASH }}
      - name: Install Capacitor tooling
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.devDependencies={...p.devDependencies,'@capacitor/core':'^7.0.0','@capacitor/cli':'^7.0.0','@capacitor/android':'^7.0.0','@capacitor/assets':undefined}; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
          pnpm install --no-frozen-lockfile
      - name: Add Android platform
        run: npx cap add android
      - name: Install image conversion tools
        run: python3 -m pip install --user --break-system-packages Pillow
      - name: Repair and generate Android app icons from the supplied artwork
        run: |
          mkdir -p resources
          python3 - <<'PY'
          from PIL import Image, ImageFile, ImageOps
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          source = Image.open("public/assets/img/myafgram-icon.jpg")
          source.load()
          source = ImageOps.fit(source.convert("RGB"), (1024, 1024), method=Image.Resampling.LANCZOS)
          source.save("resources/icon.png", format="PNG", optimize=True)
          for density, pixels in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = f"android/app/src/main/res/mipmap-{density}"
              import os
              os.makedirs(folder, exist_ok=True)
              icon = source.resize((pixels,pixels), Image.Resampling.LANCZOS)
              icon.save(f"{folder}/ic_launcher.png", format="PNG", optimize=True)
              icon.save(f"{folder}/ic_launcher_round.png", format="PNG", optimize=True)
          PY
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Sync web app into Android project
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myafgram-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
