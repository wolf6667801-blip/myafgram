name: Import Telegram Web K
on:
  push:
    paths:
      - ".github/workflows/import-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
      - name: Import upstream source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp .github/workflows/import-upstream.yml /tmp/import-upstream.yml
          git clone --no-tags --single-branch --branch master https://github.com/morethanwords/tweb.git upstream
          rm -rf upstream/.github/workflows
          mkdir -p upstream/.github/workflows
          cp /tmp/import-upstream.yml upstream/.github/workflows/import-upstream.yml
          cd upstream
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force destination HEAD:refs/heads/main
