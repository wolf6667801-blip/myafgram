name: Import Telegram Web K
on:
  push:
    paths:
      - ".github/workflows/import-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
      - name: Import upstream source without replacing local workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --branch master https://github.com/morethanwords/tweb.git /tmp/tweb
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/tweb/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: import Telegram Web K source"
          git push origin HEAD:main
